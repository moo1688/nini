appId: com.localagent.desktop
productName: LocalAgent
asar: true
files:
  - main.cjs
  - preload.cjs
  - package.json
extraResources:
  - from: ../dist
    to: dist
    filter:
      - '**/*'
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: LocalAgent-Setup-${version}-${arch}.${ext}
